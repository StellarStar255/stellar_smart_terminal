# 每次 push 到 main / 每个 PR 都跑：ruff（只查肯定是错的项）+ 全量测试（离屏）。
# 以前只有推 v* tag 时 release.yml 才跑测试，问题要到发版那一刻才暴露。
# 只跑 Linux：最便宜且与 release.yml 的 Linux job 同一套系统依赖；三平台
# 打包仍由 release.yml 负责。
name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["docs/**", "*.md", "assets/**"]
  pull_request:
    paths-ignore: ["docs/**", "*.md", "assets/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (Linux, offscreen)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system deps
        # 与 release.yml 的 Linux job 一致：PyQt6 离屏运行所需的系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -r requirements.txt pytest pytest-timeout ruff --quiet

      - name: Ruff
        run: python -m ruff check .

      - name: Tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest tests/ -q --timeout=60 --timeout-method=thread
