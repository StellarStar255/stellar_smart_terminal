# 推送 v* tag 时自动打包 macOS (arm64) 与 Windows (x64) 并上传到对应 Release。
#
# 与手动发版（docs/PACKAGING.md）兼容：release 已存在时跳过创建、只补传产物
# （--clobber 允许覆盖同名文件）；release 不存在时自动创建并生成默认 notes,
# 之后可用 `gh release edit` 替换成手写说明。
#
# 注意：GitHub 托管的 macOS runner 已全部是 Apple Silicon，Intel mac 包
# 需要自备 x86_64 机器构建。
name: Release

on:
  push:
    tags: ["v*"]
  # 手动触发：在 Actions 页面跑一次，只构建 Linux .deb 并作为 workflow artifact
  # 产出（无 tag、不碰 Release），用来在正式发版前试打验证。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    # 手动触发（workflow_dispatch）时跳过，只在推 tag 时发版
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check spec version matches tag
        run: |
          SPEC_V=$(grep -m1 CFBundleShortVersionString smart_terminal.spec | sed 's/[^0-9.]//g')
          case "$GITHUB_REF_NAME" in
            "v$SPEC_V"|"v$SPEC_V"-*) echo "spec $SPEC_V matches tag $GITHUB_REF_NAME" ;;
            *) echo "::error::smart_terminal.spec version ($SPEC_V) does not match tag ($GITHUB_REF_NAME) — bump the version before tagging (see docs/PACKAGING.md)"; exit 1 ;;
          esac

      - name: Build .app + DMG
        run: ./build.sh

      - name: Run tests (offscreen)
        run: |
          .venv-build/bin/python -m pip install pytest --quiet
          QT_QPA_PLATFORM=offscreen .venv-build/bin/python -m pytest tests/ -q

      - name: Zip app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent "dist/Stellar Smart Terminal.app" \
            "dist/Stellar-Smart-Terminal-v${VERSION}-macOS-arm64.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/Stellar-Smart-Terminal-v*-macOS-arm64.dmg \
            dist/Stellar-Smart-Terminal-v*-macOS-arm64.zip

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check spec version matches tag
        shell: bash
        run: |
          SPEC_V=$(grep -m1 CFBundleShortVersionString smart_terminal.spec | sed 's/[^0-9.]//g')
          case "$GITHUB_REF_NAME" in
            "v$SPEC_V"|"v$SPEC_V"-*) echo "spec $SPEC_V matches tag $GITHUB_REF_NAME" ;;
            *) echo "::error::smart_terminal.spec version ($SPEC_V) does not match tag ($GITHUB_REF_NAME) — bump the version before tagging (see docs/PACKAGING.md)"; exit 1 ;;
          esac

      - name: Build onedir exe
        shell: cmd
        run: build.bat

      - name: Run tests (offscreen)
        # 测试重新 gate 打包（2026-07-17）：历史上 Windows 有测试挂死、曾把
        # job 拖到 30 分钟超时，故一度设 continue-on-error 解耦——结果掩盖了
        # 真实失败（git 身份缺失，见 tests/test_git_async_ops.py）。挂死已
        # 不复现，且 pytest-timeout 能把卡死转为 60s 快速失败并 dump 线程
        # 栈，不会再拖垮 job，恢复门禁。
        shell: cmd
        run: |
          .venv-build\Scripts\python.exe -m pip install pytest pytest-timeout --quiet || exit /b 1
          set QT_QPA_PLATFORM=offscreen
          .venv-build\Scripts\python.exe -m pytest tests/ -q --timeout=60 --timeout-method=thread

      - name: Zip onedir
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          Compress-Archive -Path dist\StellarSmartTerminal `
            -DestinationPath "dist\Stellar-Smart-Terminal-v$version-windows-x64.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DMyAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/Stellar-Smart-Terminal-v*-windows-x64.zip \
            dist/Stellar-Smart-Terminal-v*-windows-x64-setup.exe

  linux:
    name: Linux (amd64)
    # 钉到 22.04 而非 ubuntu-latest(24.04)：PyInstaller 二进制链接构建机的 glibc，
    # 在 24.04(glibc 2.39) 上编的会引用 GLIBC_2.38/2.39 符号，装到 22.04(2.35) 起不来
    # （表现为"装上打不开"）。glibc 向后兼容，老机器编的能在新机器跑，故取最老可用 runner。
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check spec version matches tag
        # 仅发版（tag）时校验；手动 workflow_dispatch 没有 tag，跳过
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SPEC_V=$(grep -m1 CFBundleShortVersionString smart_terminal.spec | sed 's/[^0-9.]//g')
          case "$GITHUB_REF_NAME" in
            "v$SPEC_V"|"v$SPEC_V"-*) echo "spec $SPEC_V matches tag $GITHUB_REF_NAME" ;;
            *) echo "::error::smart_terminal.spec version ($SPEC_V) does not match tag ($GITHUB_REF_NAME) — bump the version before tagging (see docs/PACKAGING.md)"; exit 1 ;;
          esac

      - name: Install system deps
        # PyQt6 在 Linux 上导入/离屏运行需要这些系统库；imagemagick 给图标缩放，
        # dpkg-dev 提供 dpkg-deb。libxcb-cursor0 是 Qt6 xcb 平台插件的运行期依赖。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0 \
            imagemagick dpkg-dev

      - name: Build .deb
        run: ./build.sh

      - name: Run tests (offscreen)
        # 与 Windows 一致：测试 gate 打包，pytest-timeout 把卡死转为快速失败
        run: |
          .venv-build/bin/python -m pip install pytest pytest-timeout --quiet
          QT_QPA_PLATFORM=offscreen .venv-build/bin/python -m pytest tests/ -q \
            --timeout=60 --timeout-method=thread

      - name: Upload to release
        # 仅发版（tag）时挂到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/Stellar-Smart-Terminal-v*-linux-amd64.deb

      - name: Upload .deb as artifact (manual run)
        # 手动 workflow_dispatch 试打：deb 作为 workflow artifact 下载验证，不碰 Release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/Stellar-Smart-Terminal-v*-linux-amd64.deb
          if-no-files-found: error
