[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-smart-terminal"
version = "1.14.28"
description = "A PyQt6-based smart terminal with file explorer, Git GUI, LLM proxy, and VS Code extension browser"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "huangqiliang" },
]
keywords = ["terminal", "pyqt6", "git", "ssh", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "PyQt6>=6.5.0",
    "pyte>=0.8.0",
    "paramiko>=3.0.0",
    "requests>=2.28.0",
]

[project.gui-scripts]
stellar-terminal = "app:main"

[tool.setuptools]
py-modules = [
    "ai_completion",
    "app",
    "command_palette",
    "dialogs",
    "explorer_clipboard",
    "explorer_widget",
    "exporter",
    "file_editor",
    "flow_layout",
    "git_manager",
    "git_widget",
    "history_dialog",
    "i18n",
    "main_window",
    "openai_server",
    "pasted_images_dialog",
    "remote_bookmarks",
    "remote_explorer_widget",
    "session_manager",
    "ssh_session",
    "terminal_backend",
    "terminal_widget",
    "toolbar_manager",
    "utils",
    "vscode_manager",
    "vscode_widget",
    "widgets",
]
