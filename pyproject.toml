[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-smart-terminal"
version = "1.26.2"
description = "A PyQt6-based smart terminal with file explorer, Git GUI, LLM proxy, and VS Code extension browser"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "huangqiliang" },
]
keywords = ["terminal", "pyqt6", "git", "ssh", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]
dependencies = [
    "PyQt6>=6.5.0",
    "pyte>=0.8.0",
    "paramiko>=3.0.0",
    "requests>=2.28.0",
]

[project.gui-scripts]
stellar-terminal = "app:main"

[tool.pytest.ini_options]
# 环境里若装有 pytest-qt，它会在 configure 阶段按自己的偏好初始化 PySide6，
# 与本项目的 PyQt6 在同一进程混载 → QApplication 构造直接 abort/segfault。
# 本仓库不用 pytest-qt 的 fixture（QApplication 均手动管理），显式禁用；
# 未安装该插件时此选项无副作用。
addopts = "-p no:pytest-qt"

[tool.setuptools]
py-modules = [
    "ai_completion",
    "app",
    "app_config",
    "app_logging",
    "app_updater",
    "command_palette",
    "dialogs",
    "explorer_clipboard",
    "explorer_common",
    "explorer_favorites",
    "explorer_widget",
    "exporter",
    "file_editor",
    "flow_layout",
    "git_manager",
    "git_widget",
    "history_dialog",
    "i18n",
    "main_window",
    "main_window_config",
    "main_window_explorer",
    "main_window_git",
    "main_window_remote",
    "main_window_tabs",
    "main_window_theme",
    "main_window_toolbar",
    "main_window_update",
    "openai_server",
    "pasted_images_dialog",
    "remote_bookmarks",
    "remote_explorer_widget",
    "session_manager",
    "settings_transfer",
    "shell_integration",
    "ssh_control",
    "ssh_session",
    "terminal_backend",
    "terminal_render",
    "terminal_mouse",
    "terminal_input",
    "terminal_screen",
    "terminal_widget",
    "themes",
    "toolbar_manager",
    "transfer_progress",
    "utils",
    "vscode_manager",
    "vscode_widget",
    "widgets",
    "window_host",
    "window_navigator",
]

[tool.ruff]
# 只做"肯定是错"的检查：语法错误、未定义名/未用导入等 pyflakes 项，以及少数
# pycodestyle 规则。行宽、风格类不管（历史代码 1200+ 处超长行，不值得为此改动）。
target-version = "py310"
exclude = [
    ".venv-build", "build", "dist", "SmartTerminal2", "exports", "sessions",
    "scripts/make_mac_icon.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # 模块级 import 不在文件顶部：tests 的 sys.path 注入 / Qt 插件路径设置是有意的
    "E741",  # 变量名 l/O/I
    "E731",  # lambda 赋值
]
